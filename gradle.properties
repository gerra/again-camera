org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Set to false to configure the build without the Android Gradle Plugin
# (useful on machines without an Android SDK, e.g. CI boxes that only run
# the shared-module tests and the desktop harness):  -Pagain.android=false
again.android=true

# Kotlin/Native: allow klib compilation for Apple targets on non-Apple hosts
kotlin.native.enableKlibsCrossCompilation=true

# Kotlin/Native: on an Intel Mac the arm64 simulator target cannot run, so KGP disables its
# test task and warns about it on every build; this just silences that warning.
kotlin.native.ignoreDisabledTargets=true
