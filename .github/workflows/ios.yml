name: iOS

# Builds the iOS app the way Xcode does (the Kotlin framework through the project's own build
# phase), for the simulator and, unsigned, for a device in Release — the build TestFlight gets.
#
# On every pull request, built as the merge it would make, and on main once it is merged, so
# main stays buildable; a push to any other branch runs it from "Run workflow". Path-filtered,
# so it must not be a required check: a pull request that skips it would wait on it forever.
on:
  push:
    branches: [main]
    paths:
      - "composeApp/**"
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  # The same list: tools/test_play.py checks that the two stay equal.
  pull_request:
    paths:
      - "composeApp/**"
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

# A newer push to the same pull request makes the older build moot; a build of main is never
# cut short, so every merge has its result.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Shared rules, on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test -Pagain.android=false

      - name: App for the simulator (Debug)
        run: >
          xcodebuild build
          -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -destination 'generic/platform=iOS Simulator' ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO

      - name: App for a device (Release, unsigned)
        run: >
          xcodebuild build
          -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
