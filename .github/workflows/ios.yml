name: iOS

# Builds the iOS app the way Xcode does (the Kotlin framework through the project's own build
# phase), for the simulator and, unsigned, for a device in Release — the build TestFlight gets.
on:
  push:
    paths:
      - "composeApp/**"
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Shared rules, on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test -Pagain.android=false

      - name: App for the simulator (Debug)
        run: >
          xcodebuild build
          -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -destination 'generic/platform=iOS Simulator' ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO

      - name: App for a device (Release, unsigned)
        run: >
          xcodebuild build
          -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
