name: Android

# Builds the Android app on every push, as the iOS workflow does on macOS: the shared rules
# and the app's screens on the desktop harness, the debug APK for a phone, and in Release
# the app bundle Google Play takes, unsigned, so an R8 failure shows here rather than in the
# Google Play workflow. Both are kept as the run's artifact. Signing and the upload are
# play.yml, whose Python is tested here too (docs/android.md).
on:
  push:
    paths:
      - "composeApp/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "tools/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/play.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Python behind the Google Play workflow needs no JDK and takes seconds.
  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools -p 'test_*.py'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Shared rules and the app's screens, on the desktop harness
        run: ./gradlew :shared:desktopTest :composeApp:desktopTest

      - name: App for a phone (Debug)
        run: ./gradlew :composeApp:assembleDebug

      - name: App bundle for Google Play (Release, unsigned)
        run: ./gradlew :composeApp:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: again-android-${{ github.run_number }}
          if-no-files-found: error
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/outputs/bundle/release/*.aab
