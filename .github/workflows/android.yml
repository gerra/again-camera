name: Android

# Builds the Android app, as the iOS workflow does on macOS: the shared rules and the app's
# screens on the desktop harness, the debug APK for a phone, lint, and in Release the app
# bundle Google Play takes, unsigned, so an R8 failure shows here rather than in the Google
# Play workflow. The APK and the bundle are kept as the run's artifact. Signing and the upload
# are play.yml, whose Python is tested here too (docs/android.md).
#
# On every pull request, built as the merge it would make, and on main once it is merged, so
# main stays buildable; a push to any other branch runs it from "Run workflow". Path-filtered,
# so it must not be a required check: a pull request that skips it would wait on it forever.
on:
  push:
    branches: [main]
    paths:
      - "composeApp/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "tools/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/play.yml"
  # The same list: tools/test_play.py checks that the two stay equal.
  pull_request:
    paths:
      - "composeApp/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "tools/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/play.yml"
  workflow_dispatch:

# A newer push to the same pull request makes the older build moot; a build of main is never
# cut short, so every merge has its result.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Python behind the Google Play workflow needs no JDK and takes seconds.
  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools -p 'test_*.py'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Shared rules and the app's screens, on the desktop harness
        run: ./gradlew :shared:desktopTest :composeApp:desktopTest

      - name: App for a phone (Debug)
        run: ./gradlew :composeApp:assembleDebug

      # Lint errors fail the build (composeApp/android.gradle); warnings only show in the report.
      - name: Android lint
        run: ./gradlew :composeApp:lintDebug

      - name: App bundle for Google Play (Release, unsigned)
        run: ./gradlew :composeApp:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: again-android-${{ github.run_number }}
          if-no-files-found: error
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/outputs/bundle/release/*.aab

      # On a lint error the report says which; on an R8 "Missing class" failure,
      # missing_rules.txt holds the -dontwarn lines it asks for.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            composeApp/build/reports/lint-results-debug.*
            composeApp/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore
