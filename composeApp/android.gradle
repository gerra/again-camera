// Android application configuration for :composeApp (applied only when again.android=true).
android {
    namespace "sh.gerra.again"
    compileSdk libs.versions.android.compileSdk.get().toInteger()

    defaultConfig {
        // Public on Google Play, and Play never lets it change after the first upload.
        applicationId "sh.gerra.again"
        minSdk libs.versions.android.minSdk.get().toInteger()
        targetSdk libs.versions.android.targetSdk.get().toInteger()
        versionCode((project.findProperty("again.versionCode") ?: "1").toInteger())
        versionName "1.0"
    }
    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        warningsAsErrors false
    }
}
