# nginx vhost for again.gerra.sh, the app's static site: landing page, privacy policy, support.
# Pushed by `python3 tools/deploy_site.py nginx`; the pages in site/ by `deploy_site.py site`.
# Nothing is proxied: Again has no server, so the site is files and nothing else.
#
# Cert (once, after the DNS A record exists):
#   ssh hetzner_gb 'certbot certonly --nginx -d again.gerra.sh'
# Always `certonly` — never bare `certbot --nginx` (its installer injects duplicate server
# blocks).

server {
    server_name again.gerra.sh;
    root /var/www/again.gerra.sh;

    # Clean URLs: /privacy serves privacy.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    include /opt/ssl-manager/web_server_includes/nginx_well_known_service_template.conf;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/again.gerra.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/again.gerra.sh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name again.gerra.sh;

    # Redirect scoped to location / so the ACME .well-known include stays reachable
    location / {
        return 301 https://again.gerra.sh$request_uri;
    }

    include /opt/ssl-manager/web_server_includes/nginx_well_known_service_template.conf;
}
